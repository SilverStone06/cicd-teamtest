name: Nginx Deployment Pipeline (Private EC2 via SSM & ECR)

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- [CD 영역 시작: AWS 자격 증명 설정] ---
      # ECR 로그인 및 SSM 명령 실행을 위해 AWS 권한을 먼저 얻습니다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --- [CD 영역: ECR 로그인] ---
      # Docker Hub 대신 AWS ECR 창고에 접근하기 위해 로그인합니다.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- [CD 영역: 도커 이미지 생성 및 ECR 푸시] ---
      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 빌드 시 ECR 주소를 포함한 태그를 생성합니다.
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./nginx-private
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./nginx-private
          # 생성된 이미지를 ECR 창고로 푸시합니다.
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # --- [CD 영역: SSM을 통한 EC2 실 배포] ---
      # Private EC2 내부망에 있는 에이전트에게 ECR 이미지를 배포하도록 명령합니다.
      - name: Deploy to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          PARAMS=$(printf '{"commands":["aws ecr get-login-password --region %s | sudo docker login --username AWS --password-stdin %s","sudo docker pull %s/%s:%s","sudo docker stop nginx-server || true","sudo docker rm nginx-server || true","sudo docker run -d --name nginx-server -p 80:80 %s/%s:%s","sudo docker image prune -f"]}' \
            "$AWS_REGION" "$ECR_REGISTRY" \
            "$ECR_REGISTRY" "$ECR_REPOSITORY" "$IMAGE_TAG" \
            "$ECR_REGISTRY" "$ECR_REPOSITORY" "$IMAGE_TAG")
          aws ssm send-command \
            --targets "Key=tag:${{ secrets.ASG_TAG_KEY }},Values=${{ secrets.EC2_INSTANCE_TAG }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying Nginx from ECR via SSM" \
            --region $AWS_REGION \
            --parameters "$PARAMS"
